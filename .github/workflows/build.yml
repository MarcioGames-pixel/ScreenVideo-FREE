name: Build ScreenVideo FREE

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install legacy Android command-line tools
        shell: bash
        run: |
          set -e
          SDK="$HOME/android-sdk"
          rm -rf "$SDK" /tmp/cmdline-tools /tmp/cmdline-tools.zip
          mkdir -p "$SDK/cmdline-tools" /tmp/cmdline-tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-6609375_latest.zip" -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          SDKMANAGER=$(find /tmp/cmdline-tools -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          TOOLS_DIR=$(dirname "$(dirname "$SDKMANAGER")")
          mkdir -p "$SDK/cmdline-tools/legacy"
          cp -R "$TOOLS_DIR"/. "$SDK/cmdline-tools/legacy/"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/legacy/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$SDK/cmdline-tools/legacy/bin/sdkmanager" --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;28.0.3"

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Check SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenVideo-FREE-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
name: Build ScreenVideo FREE

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools" /tmp/android-tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-6609375_latest.zip" -O /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          TOOLS_DIR=$(find /tmp/android-tools -type f -name sdkmanager | head -n 1 | xargs dirname | xargs dirname)
          mkdir -p "$SDK/cmdline-tools/legacy"
          cp -R "$TOOLS_DIR"/. "$SDK/cmdline-tools/legacy/"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/legacy/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/legacy/bin/sdkmanager" --licenses || true
          "$SDK/cmdline-tools/legacy/bin/sdkmanager" "platform-tools" "platforms;android-28" "build-tools;28.0.3"
      - name: Build Android 1.5/1.6 and 2.0/4.4 APKs
        run: ./gradlew assembleCupcakeDebug assembleLegacyDebug --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ScreenVideo-FREE-legacy-apks
          path: |
            app/build/outputs/apk/cupcake/debug/*.apk
            app/build/outputs/apk/legacy/debug/*.apk
          if-no-files-found: error
plugins {
    id 'com.android.application'
}

android {
    compileSdk 28
    defaultConfig {
        applicationId 'com.screenvideo.free'
        minSdk 3
        targetSdk 19
        versionCode 3
        versionName '0.3-legacy'
    }
    flavorDimensions "androidEra"
    productFlavors {
        cupcake {
            dimension "androidEra"
            minSdk 3
            targetSdk 4
            versionCode 31
            versionName "0.3-Cupcake-Doughnut"
        }
        legacy {
            dimension "androidEra"
            minSdk 5
            targetSdk 19
            versionCode 32
            versionName "0.3-Eclair-KitKat"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}
dependencies {}